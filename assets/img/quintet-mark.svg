<svg xmlns="http://www.w3.org/2000/svg" viewBox="32.5 32.5 175 175" fill="none" role="img" aria-label="Quintet Daily">
  <!-- Quintet Daily mark. Q formed from five arc segments.
       Geometry: r=74, stroke-width=15, circumference 464.96.
       One fifth = 92.99 -> dash 74.49 + gap 18.5.
       dashoffset 25.6 parks a gap where the tail meets the ring. -->
  <circle cx="114" cy="114" r="74"
          stroke="currentColor" stroke-width="15"
          stroke-dasharray="74.49 18.5" stroke-dashoffset="25.6"/>
  <path d="M166 166 L200 200"
        stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
</svg>
